<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth API Lab</title>
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
    <div class="auth-container">
        <h1>Welcome to Auth API</h1>
        <p class="subtitle">Secure Node.js & MongoDB Authentication Lab</p>

        <form class="auth-form" id="loginForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="input-group">
                <label for="twoFactor">2FA Authenticator Code</label>
                <input type="text" id="twoFactor" placeholder="6-digit code" maxlength="6">
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="#">Register</a></p>
        </div>
    </div>
</body>
</html>
